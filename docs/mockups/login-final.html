<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login final — Disparo de Cobranças</title>
<style>
  :root { --ink: oklch(0.24 0.03 255); --muted: oklch(0.47 0.025 255); --bg: oklch(0.972 0.016 40); --azul: oklch(0.55 0.11 250); --abobora: oklch(0.8 0.11 62); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 28px 32px 8px; max-width: 1520px; margin: 0 auto; }
  header p { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  header h1 { margin: 8px 0 6px; font-size: 36px; font-weight: 800; letter-spacing: -.02em; }
  header span { font-size: 15px; color: var(--muted); }
  main { max-width: 1520px; margin: 0 auto; padding: 16px 32px 48px; display: grid; gap: 28px; }
  figure { margin: 0; }
  figcaption { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 14px; font-weight: 700; }
  figcaption b { background: var(--abobora); color: oklch(0.25 0.04 50); padding: 4px 10px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  img { display: block; width: 100%; height: auto; border: 1px solid oklch(0.82 0.022 40); box-shadow: 0 18px 40px -24px rgb(0 0 0 / .35); }
  .linha { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start; }
  @media (max-width: 1000px) { .linha { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <p>Resultado final · implementado</p>
  <h1>Tela de entrada — Disparo de Cobranças</h1>
  <span>Capturas do sistema rodando (localhost), sem sessão, zoom 100%. Design system da entrada do ImobDesk + cena do boleto.</span>
</header>
<main>
  <figure><figcaption><b>1</b> Computador · Entrar (1440 × 900)</figcaption><img src="login-final/1-entrar.png" alt="Tela de entrada no computador"></figure>
  <figure><figcaption><b>2</b> Computador · Senha errada</figcaption><img src="login-final/2-erro.png" alt="Aviso de e-mail ou senha incorretos"></figure>
  <div class="linha">
    <figure><figcaption><b>3</b> Computador · Recuperar senha</figcaption><img src="login-final/3-recuperar.png" alt="Tela de recuperar senha"></figure>
    <figure><figcaption><b>4</b> Celular (390 px)</figcaption><img src="login-final/4-celular.png" alt="Tela de entrada no celular"></figure>
  </div>
</main>
</body>
</html>
