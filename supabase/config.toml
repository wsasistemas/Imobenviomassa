# Supabase ImobSystem (compartilhado com ImobSystem, Imobsuprimentos e ImobDoces). Schema do app: imobenviomassa.
# A configuração original da Calper está em supabase/_referencia-calper/config.toml (só consulta).
project_id = "ikvjaowvpvxojvcfwnct"

# Edge Functions com o prefixo do app: o projeto é compartilhado e nomes genéricos colidiriam com os de outros sistemas.
# Deploy: supabase functions deploy imobenviomassa-api-proxy imobenviomassa-totvs-soap-proxy
# Secrets (Dashboard -> Edge Functions -> Secrets):
#   ALLOWED_ORIGINS=https://enviomassa.imobsystems.com.br,http://localhost:3000   # CORS das functions
#   GW_<NOME>...                                                                  # secrets de API do gateway
[functions.imobenviomassa-api-proxy]
verify_jwt = true

[functions.imobenviomassa-totvs-soap-proxy]
verify_jwt = true

# ---------------------------------------------------------------------------------------------------------------------
# SEM seção [auth] de propósito. O login (Supabase Auth) é do projeto inteiro: um `supabase config push` com
# enable_signup, jwt_expiry, MFA ou rate limits mudaria o login de TODOS os sistemas do ImobSystem. Ajustes de Auth
# só pelo Dashboard, combinados com os outros apps. O que o Imobenviomassa precisa já está no próprio app:
#   · sem autocadastro: usuários só pela tela Usuários (server function com service_role);
#   · limite de tentativas de login: imobenviomassa.auth_pre_login / auth_registrar_resultado;
#   · MFA (TOTP): exigido nas operações sensíveis pela claim aal2 (src/lib/authz.ts).
# ---------------------------------------------------------------------------------------------------------------------
